name: EcoCircle Chained QA & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1: Jest Unit, Functional & Security Tests
  # ─────────────────────────────────────────────
  jest-tests:
    name: "Stage 1 | Jest Unit & Functional Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Run Jest Test Suites
        run: npm run test:ci

      - name: Upload Jest Results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-results
          path: jest-results.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # STAGE 2: Build Application
  # ─────────────────────────────────────────────
  build:
    name: "Stage 2 | Build Application"
    runs-on: ubuntu-latest
    needs: jest-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Static Web App
        run: npm run build

      - name: Upload Built App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-app
          path: www/
          retention-days: 7

  # ─────────────────────────────────────────────
  # STAGE 3: Selenium E2E Web Browser Tests
  # ─────────────────────────────────────────────
  selenium-tests:
    name: "Stage 3 | Selenium E2E Browser Automation"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Built App
        uses: actions/download-artifact@v4
        with:
          name: built-app
          path: www/

      - name: Download Jest Results
        uses: actions/download-artifact@v4
        with:
          name: jest-results
          path: .

      - name: Verify Chrome Installation
        run: google-chrome --version

      - name: Start Local App Server
        run: |
          python -m http.server 3000 --directory www &
          sleep 3
          curl --retry 5 --retry-delay 1 --retry-connrefused http://localhost:3000 -o /dev/null -s -w "HTTP Status: %{http_code}\n"

      - name: Run Selenium E2E Test Suite
        run: PYTHONUTF8=1 python run_e2e.py
        env:
          DISPLAY: :99

      - name: Run Enterprise Selenium Automation Pipeline
        run: PYTHONUTF8=1 python automation/run_automation.py
        env:
          BASE_URL: "http://localhost:3000"
          HEADLESS: "true"

      - name: Upload Selenium Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-results
          path: |
            selenium_results.json
            Test Results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # STAGE 4: Appium Android Mobile Tests
  # ─────────────────────────────────────────────
  appium-tests:
    name: "Stage 4 | Appium Android Mobile Tests"
    runs-on: ubuntu-latest
    needs: selenium-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium & Python Mobile Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Appium Mobile Test Suite
        run: PYTHONUTF8=1 python android-tests/appium_tests.py

      - name: Upload Appium Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-results
          path: android_test_results.json
          retention-days: 7

  # ─────────────────────────────────────────────
  # STAGE 5: Consolidated Multi-Format QA Reports
  # ─────────────────────────────────────────────
  generate-reports:
    name: "Stage 5 | Consolidated QA Report Generation"
    runs-on: ubuntu-latest
    needs: appium-tests
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Jest Results
        uses: actions/download-artifact@v4
        with:
          name: jest-results
          path: .

      - name: Download Selenium Results
        uses: actions/download-artifact@v4
        with:
          name: selenium-results
          path: .

      - name: Download Appium Results
        uses: actions/download-artifact@v4
        with:
          name: appium-results
          path: .

      - name: Generate Consolidated QA Reports (HTML + JSON + Excel + Markdown)
        run: PYTHONUTF8=1 python generate_reports.py

      - name: Upload Excel Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EcoCircle-Excel-Report
          path: E2E_Test_Report.xlsx
          retention-days: 30

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EcoCircle-HTML-Report
          path: test-report.html
          retention-days: 30

      - name: Upload JSON Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EcoCircle-JSON-Report
          path: test-results.json
          retention-days: 30

      - name: Upload Markdown Summary Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EcoCircle-Test-Summary
          path: TEST_SUMMARY.md
          retention-days: 30

      - name: Publish GitHub Step Summary
        if: always()
        run: cat TEST_SUMMARY.md >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # STAGE 6: Deploy to GitHub Pages & Verify
  # ─────────────────────────────────────────────
  deploy:
    name: "Stage 6 | Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: generate-reports
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Download Built App
        uses: actions/download-artifact@v4
        with:
          name: built-app
          path: www/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy EcoCircle to GitHub Pages [skip ci]'

      - name: Verify Live Deployment
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "========================================"
          echo "  DEPLOYMENT SUCCESSFUL!"
          echo "  Live at: $BASE_URL"
          echo "========================================"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" || echo "000")
          echo "Live HTTP Status Code: $STATUS_CODE"
